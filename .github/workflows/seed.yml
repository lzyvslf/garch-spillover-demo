name: seed
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch pack
        run: |
          curl -fsSL "https://tool.supubao.com/assets/samples/garch-demo/garch-spillover-demo.zip?v=20261122" -o /tmp/p.zip
          ls -l /tmp/p.zip
          mkdir -p /tmp/ex && cd /tmp/ex && unzip -q /tmp/p.zip
          ls /tmp/ex/garch-spillover-demo
      - name: copy into repo
        run: cp -r /tmp/ex/garch-spillover-demo/. .
      - name: write README
        run: |
          cat > README.md <<'READMEEOF'
          # garch-spillover-demo

          GARCH(1,1) 波动率建模 + Diebold-Yilmaz 波动溢出的最小可复现研究包：一条命令出结果，自带哈希校验，拿到手就能自查有没有被动过。

          不是"给你一堆数字"，而是"给你一套能重跑、能验真、能照着写进报告的流程"。

          ## 一分钟跑通

          ```bash
          python -m venv .venv && source .venv/bin/activate
          pip install -r requirements.txt
          python run_all.py      # 六步：造数 -> GARCH -> VAR -> 溢出 -> 出图 -> 写清单
          python verify.py       # 最后一行应为 VERDICT=PASS
          ```

          ## 只想验证、不想算

          ```bash
          sha256sum -c checksums.txt   # Linux/macOS
          python verify.py
          ```

          checksums.txt 覆盖数据、结果与稳定源码，不含 RUN.md / manifest.json / checksums.txt 本身（含生成时间）。改一个字节，verify.py 立刻打 FAIL 并打印期望/实际哈希前缀。

          ## 包里有什么

          | 路径 | 作用 |
          |---|---|
          | src/data_gen.py | 制造 4 资产、2000 天合成收益（GARCH(1,1) + 跨资产冲击传导） |
          | src/garch_model.py | AR(1)+GARCH(1,1)+t 分布拟合，输出持续性 |
          | src/spillover.py | VAR + 广义方差分解，算两两溢出与总溢出指数 TOI |
          | src/plotting.py | 三张图（热力图 / 条件波动 / TOI 时序） |
          | run_all.py | 一条命令串起全流程并写清单 |
          | verify.py | 13 项哈希 + 关键数字容差比对 |
          | data/ output/ | 固化结果，供未装环境的人直接查看 |

          ## 本包实测数字（seed=20261122，2000 天，VAR 滞后阶 1）

          - 总溢出指数 TOI 约 15.37%
          - 持续性：EQ_CN 0.9777 / EQ_US 0.9593 / CRUDE 0.9784 / GOLD 0.9787（>0.995 打 persistent_flag）
          - 滚动窗口 181 点

          ## 边界

          - 数据是合成数据，用于演示方法与流程，不构成任何市场判断。
          - 只承诺"收到未被改过"（哈希逐字节一致）+ 关键数字 1e-6 容差内一致；MLE/VAR 依赖 BLAS，换机器重跑末位可能飘，不承诺跨任意环境逐字节一致。
          - GARCH 对样本长度与分布假设敏感；DY 溢出依赖 VAR 阶数与窗口宽度，改参数结论会变，属正常。

          ## 在线预览

          <https://tool.supubao.com/docs/garch-pack>
          READMEEOF
      - name: commit payload
        run: |
          git config user.name lzyvslf
          git config user.email lzyvslf@users.noreply.github.com
          git add -A
          git commit -m "feat: add GARCH(1,1) + Diebold-Yilmaz spillover demo pack (20 files)"
          git push
      - name: remove this workflow
        run: |
          git rm -f .github/workflows/seed.yml
          git commit -m "chore: remove one-shot seed workflow"
          git push
